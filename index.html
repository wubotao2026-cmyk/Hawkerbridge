<!DOCTYPE html>
<html>
<head>
  <title>HawkerBridge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      margin: 0;
      color: #111827;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 30px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .container {
      padding: 25px;
      max-width: 1200px;
      margin: auto;
    }

    .filters {
      background: white;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
      margin-bottom: 25px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .filters input,
    .filters select {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
    }

    .match-box {
      background: #f8fafc;
      border: 1px solid #dbe3ef;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 25px;
    }

    .quiz-button,
    .interest-button {
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      border-radius: 12px;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 22px;
    }

    .card {
      position: relative;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 18px 40px rgba(0,0,0,0.12);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #e5e7eb;
      display: block;
    }

    .card-content {
      padding: 15px;
    }

    .card-content h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .card-content p {
      margin: 5px 0;
      font-size: 14px;
      color: #374151;
    }

    .tag {
      display: inline-block;
      background: #e0f2fe;
      color: #075985;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      margin-top: 8px;
      font-weight: 500;
    }

    .uploaded-date {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 8px;
    }

    .new-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #ef4444;
      color: white;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 8px;
      font-weight: bold;
      z-index: 2;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 999;
      padding: 20px;
    }

    .modal-content {
      background: white;
      margin: 5% auto;
      padding: 25px;
      border-radius: 18px;
      width: 85%;
      max-width: 700px;
    }

    .close {
      float: right;
      cursor: pointer;
      font-size: 24px;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 18px;
      border: 1px solid #e5e7eb;
      color: #6b7280;
    }
  </style>
</head>

<body>

<header>
  <h1>HawkerBridge</h1>
</header>

<div class="container">

  <div class="filters">
    <input id="searchInput" placeholder="Search...">
    <select id="vicinityFilter"><option value="">All Areas</option></select>
    <select id="languageFilter"><option value="">All Languages</option></select>
    <select id="cooperationFilter"><option value="">All Opportunities</option></select>
    <select id="cuisineFilter"><option value="">All Cuisines</option></select>
  </div>

  <div class="match-box">
    <h3>Not sure?</h3>
    <a class="quiz-button" href="quiz.html">Take Quiz</a>
  </div>

  <div id="data" class="grid">Loading...</div>

</div>

<div id="modal" class="modal" onclick="closeModalFromOutside(event)">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modalDetails"></div>
  </div>
</div>

<script>
const sheetURLs = [
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuhhfOdptB_dD6bCtEKxqSMaMMsQwKJrutpm_6_0700tBfd05o_pinEsDMoJo2_IefY8PAmXw_oZ6R/pub?gid=573141939&single=true&output=csv",
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuhhfOdptB_dD6bCtEKxqSMaMMsQwKJrutpm_6_0700tBfd05o_pinEsDMoJo2_IefY8PAmXw_oZ6R/pub?gid=1090865305&single=true&output=csv",
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuhhfOdptB_dD6bCtEKxqSMaMMsQwKJrutpm_6_0700tBfd05o_pinEsDMoJo2_IefY8PAmXw_oZ6R/pub?gid=346350130&single=true&output=csv",
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuhhfOdptB_dD6bCtEKxqSMaMMsQwKJrutpm_6_0700tBfd05o_pinEsDMoJo2_IefY8PAmXw_oZ6R/pub?gid=208707379&single=true&output=csv"
];

let hawkers = [];
let currentList = [];

function clean(value) {
  return value ? value.trim() : "";
}

function getField(row, possibleNames) {
  for (const name of possibleNames) {
    if (row[name] && row[name].trim() !== "") {
      return row[name].trim();
    }
  }
  return "";
}

function parseDate(value) {
  if (!value) return new Date(0);
  const parts = value.split(/[\/\s:]+/);
  if (parts.length >= 3) {
    return new Date(parts[2], parts[1] - 1, parts[0], parts[3] || 0, parts[4] || 0);
  }
  return new Date(value);
}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let value = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {
      value += '"';
      i++;
    } else if (char === '"') {
      insideQuotes = !insideQuotes;
    } else if (char === "," && !insideQuotes) {
      row.push(value);
      value = "";
    } else if ((char === "\n" || char === "\r") && !insideQuotes) {
      if (value || row.length) {
        row.push(value);
        rows.push(row);
        row = [];
        value = "";
      }
    } else {
      value += char;
    }
  }

  if (value || row.length) {
    row.push(value);
    rows.push(row);
  }

  return rows;
}

function makeImageURL(url) {
  if (!url) return "";

  url = url.trim();

  if (url.includes("drive.google.com/file/d/")) {
    const id = url.split("/file/d/")[1]?.split("/")[0];
    if (id) return "https://drive.google.com/thumbnail?id=" + id + "&sz=w600";
  }

  if (url.includes("drive.google.com/open?id=")) {
    const id = url.split("id=")[1]?.split("&")[0];
    if (id) return "https://drive.google.com/thumbnail?id=" + id + "&sz=w600";
  }

  return url;
}

function loadData() {
  Promise.all(sheetURLs.map(url => fetch(url).then(r => r.text())))
    .then(results => {
      hawkers = [];

      results.forEach(data => {
        const rows = parseCSV(data);
        const headers = rows[0].map(h => h.trim());

        rows.slice(1).forEach(row => {
          let r = {};
          headers.forEach((h, i) => {
            r[h] = row[i] || "";
          });

          const hawker = {
            name: getField(r, [
              "Full name",
              "Name",
              "姓名",
              "Nama penuh",
              "முழு பெயர்"
            ]),

            stallName: getField(r, [
              "Store name",
              "Stall Name",
              "Stall name",
              "Name of stall",
              "店名",
              "Nama gerai",
              "கடை பெயர்"
            ]),

            cuisine: getField(r, [
              "Cooking type",
              "Cuisine",
              "Type of cuisine",
              "Type of food",
              "菜系",
              "Jenis masakan",
              "சமையல் வகை"
            ]),

            location: getField(r, [
              "Where is the store located?",
              "Location",
              "Area",
              "Vicinity",
              "地点",
              "Lokasi",
              "இடம்"
            ]),

            languages: getField(r, [
              "What languages can you speak:",
              "What languages ​​can you speak:",
              "Languages",
              "Languages you can speak",
              "语言",
              "Bahasa",
              "மொழிகள்"
            ]),

            cooperation: getField(r, [
              "Opportunities",
              "Opportunity",
              "Cooperation type",
              "What opportunities are you open to?",
              "机会",
              "Peluang",
              "வாய்ப்புகள்"
            ]),

            contact: getField(r, [
              "Contact",
              "Phone number",
              "Email",
              "联系方式",
              "Nombor telefon",
              "தொடர்பு"
            ]),

            directContact: getField(r, [
              "Direct Contact",
              "Can applicants contact you directly?",
              "Allow direct contact?"
            ]),

            image: makeImageURL(getField(r, [
              "Image",
              "Upload image",
              "Photo",
              "Upload a photo",
              "图片",
              "Gambar",
              "படம்"
            ])),

            timestamp: parseDate(getField(r, ["Timestamp"]))
          };

          if (hawker.name || hawker.stallName || hawker.cuisine || hawker.location) {
            hawkers.push(hawker);
          }
        });
      });

      hawkers.sort((a, b) => b.timestamp - a.timestamp);

      populateFilters();
      applyFilters();
    })
    .catch(error => {
      document.getElementById("data").innerHTML =
        `<div class="empty">Could not load hawker data. Check that your Google Sheets are published as CSV.</div>`;
      console.error(error);
    });
}

function displayHawkers(list) {
  currentList = list;

  if (list.length === 0) {
    document.getElementById("data").innerHTML =
      `<div class="empty">No hawkers found.</div>`;
    return;
  }

  let html = "";

  list.forEach((h, i) => {
    const dateText = h.timestamp && !isNaN(h.timestamp)
      ? h.timestamp.toLocaleDateString("en-SG")
      : "";

    html += `
      <div class="card" onclick="openModal(${i})">
        <div class="new-badge">NEW</div>

        <img
          src="${h.image || 'https://via.placeholder.com/400x250?text=No+Image'}"
          onerror="this.src='https://via.placeholder.com/400x250?text=Image+Unavailable'"
        >

        <div class="card-content">
          <h3>${h.stallName || "Unnamed Stall"}</h3>
          <p><strong>Owner:</strong> ${h.name || "Not stated"}</p>
          <p><strong>Cuisine:</strong> ${h.cuisine || "Not stated"}</p>
          <p><strong>Location:</strong> ${h.location || "Not stated"}</p>
          <span class="tag">${h.languages || "Languages not stated"}</span>
          <p class="uploaded-date">${dateText}</p>
        </div>
      </div>
    `;
  });

  document.getElementById("data").innerHTML = html;
}

function openModal(i) {
  const h = currentList[i];

  const direct = (h.directContact || "").toLowerCase();
  const allowed =
    direct.includes("yes") ||
    direct.includes("ya") ||
    direct.includes("要") ||
    direct.includes("ஆம்");

  const contactBlock = allowed
    ? `<p><strong>Contact:</strong> ${h.contact || "Not stated"}</p>`
    : `<a class="interest-button"
          href="https://docs.google.com/forms/d/e/1FAIpQLSepecQxEnAd-q-0KxFCv8OKKCCtmUSd_A6DalftjvKqO5tMVg/viewform?entry.882535211=${encodeURIComponent(h.name)}"
          target="_blank">
          I'm interested
       </a>`;

  document.getElementById("modalDetails").innerHTML = `
    <h2>${h.stallName || "Unnamed Stall"}</h2>
    <p><strong>Owner:</strong> ${h.name || "Not stated"}</p>
    <p><strong>Cuisine:</strong> ${h.cuisine || "Not stated"}</p>
    <p><strong>Location:</strong> ${h.location || "Not stated"}</p>
    <p><strong>Languages:</strong> ${h.languages || "Not stated"}</p>
    <p><strong>Opportunities:</strong> ${h.cooperation || "Not stated"}</p>
    ${contactBlock}
  `;

  document.getElementById("modal").style.display = "block";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function closeModalFromOutside(event) {
  if (event.target.id === "modal") {
    closeModal();
  }
}

function addOption(select, value) {
  if (!value) return;
  const option = document.createElement("option");
  option.value = value;
  option.textContent = value;
  select.appendChild(option);
}

function populateFilters() {
  const vicinityFilter = document.getElementById("vicinityFilter");
  const languageFilter = document.getElementById("languageFilter");
  const cooperationFilter = document.getElementById("cooperationFilter");
  const cuisineFilter = document.getElementById("cuisineFilter");

  vicinityFilter.innerHTML = `<option value="">All Areas</option>`;
  languageFilter.innerHTML = `<option value="">All Languages</option>`;
  cooperationFilter.innerHTML = `<option value="">All Opportunities</option>`;
  cuisineFilter.innerHTML = `<option value="">All Cuisines</option>`;

  ["North", "South", "East", "West", "Central"].forEach(v => addOption(vicinityFilter, v));

  ["English", "中文", "Bahasa Melayu", "தமிழ்"].forEach(v => addOption(languageFilter, v));

  ["Mentorship", "Apprenticeship", "Stall takeover", "Recipe sharing"].forEach(v => addOption(cooperationFilter, v));

  ["Chinese", "Malay", "Indian", "Western"].forEach(v => addOption(cuisineFilter, v));
}

function applyFilters() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const area = document.getElementById("vicinityFilter").value.toLowerCase();
  const language = document.getElementById("languageFilter").value.toLowerCase();
  const cooperation = document.getElementById("cooperationFilter").value.toLowerCase();
  const cuisine = document.getElementById("cuisineFilter").value.toLowerCase();

  const filtered = hawkers.filter(h => {
    const combined = `
      ${h.name}
      ${h.stallName}
      ${h.cuisine}
      ${h.location}
      ${h.languages}
      ${h.cooperation}
    `.toLowerCase();

    return (
      combined.includes(search) &&
      (!area || h.location.toLowerCase().includes(area)) &&
      (!language || h.languages.toLowerCase().includes(language)) &&
      (!cooperation || h.cooperation.toLowerCase().includes(cooperation)) &&
      (!cuisine || h.cuisine.toLowerCase().includes(cuisine))
    );
  });

  displayHawkers(filtered);
}

document.getElementById("searchInput").addEventListener("input", applyFilters);
document.getElementById("vicinityFilter").addEventListener("change", applyFilters);
document.getElementById("languageFilter").addEventListener("change", applyFilters);
document.getElementById("cooperationFilter").addEventListener("change", applyFilters);
document.getElementById("cuisineFilter").addEventListener("change", applyFilters);

loadData();
</script>

</body>
</html>
