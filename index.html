<!DOCTYPE html>
<html>
<head>
  <title>HawkerBridge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: #f6f7fb;
      margin: 0;
      color: #111827;
    }

    header {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      padding: 55px 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 46px;
    }

    header p {
      max-width: 680px;
      margin: 14px auto 0;
      color: #dbeafe;
    }

    /* FIXED: home button OUTSIDE media query */
    .home-button {
      display: inline-block;
      margin-top: 18px;
      background: white;
      color: #1e3a8a;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      transition: 0.2s;
    }

    .home-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(255,255,255,0.25);
    }

    .container {
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .filters {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 25px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    input, select {
      padding: 11px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 22px;
    }

    .card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #eef2f7;
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card-content {
      padding: 16px;
    }

    .tag {
      display: inline-block;
      background: #e0f2fe;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      margin-top: 8px;
    }

    .modal {
      display: none;
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
    }

    .modal-content {
      background: white;
      margin: 5% auto;
      padding: 25px;
      width: 80%;
      max-width: 700px;
      border-radius: 20px;
    }

    .interest-button {
      display: inline-block;
      margin-top: 10px;
      background: #2563eb;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>HawkerBridge</h1>
  <p>Connecting aspiring hawkers with experienced stall owners.</p>

  <a class="home-button"
     href="https://sites.google.com/vjc.edu.sg/hawkerbridge/i-am-a-aspiring-hawker"
     target="_blank">
    Back to Home
  </a>
</header>

<div class="container">

  <div class="filters">
    <input id="searchInput" placeholder="Search...">
  </div>

  <div id="data" class="grid"></div>

</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <span onclick="closeModal()">X</span>
    <div id="modalDetails"></div>
  </div>
</div>

<script>

let hawkers = [
  {name:"Ah Beng", stallName:"Chicken Rice King", location:"East", cuisine:"Chinese", languages:"English", phone:"12345678"}
];

function displayHawkers(list) {
  let html = "";

  list.forEach((h, index) => {
    html += `
      <div class="card" onclick="openModal(${index})">
        <img src="https://via.placeholder.com/300">
        <div class="card-content">
          <h3>${h.name}</h3>
          <p>${h.stallName}</p>
          <p>${h.cuisine}</p>
          <span class="tag">${h.languages}</span>
        </div>
      </div>
    `;
  });

  document.getElementById("data").innerHTML = html;
}

function openModal(index) {
  const h = hawkers[index];

  document.getElementById("modalDetails").innerHTML = `
    <h2>${h.stallName}</h2>
    <p>${h.location}</p>

    <a class="interest-button"
      href="https://docs.google.com/forms/"
      target="_blank">
      Apply here
    </a>

    <p>Phone: ${h.phone}</p>
  `;

  document.getElementById("modal").style.display = "block";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* ESC CLOSE */
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeModal();
});

displayHawkers(hawkers);

</script>

</body>
</html>
