<!DOCTYPE html>
<html>
<head>
  <title>HawkerBridge Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f1e8;
      margin: 0;
      color: #2b2118;
    }

    header {
      background: #5a3e2b;
      color: white;
      padding: 30px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px;
    }

    .quiz-box, .result-card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 18px;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button, .back-link {
      display: inline-block;
      margin-top: 20px;
      background: #5a3e2b;
      color: white;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
    }

    .result-card img {
      width: 100%;
      max-height: 230px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .score {
      background: #eee1d1;
      display: inline-block;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .hidden-contact {
      color: #8a4b2a;
      font-style: italic;
    }
  </style>
</head>

<body>

<header>
  <h1>HawkerBridge Matching Quiz</h1>
  <p>Find hawkers that best match your interests.</p>
</header>

<div class="container">

  <div class="quiz-box">
    <h2>Tell us what you are looking for</h2>

    <label>Preferred area</label>
    <select id="vicinity">
      <option value="">No preference</option>
      <option>North</option>
      <option>South</option>
      <option>East</option>
      <option>West</option>
      <option>Central</option>
    </select>

    <label>Preferred cuisine</label>
    <select id="cuisine">
      <option value="">No preference</option>
      <option>Chinese</option>
      <option>Malay</option>
      <option>Indian</option>
      <option>Western</option>
    </select>

    <label>Language you are comfortable with</label>
    <select id="language">
      <option value="">No preference</option>
      <option>English</option>
      <option>Chinese</option>
      <option>Malay</option>
      <option>Tamil</option>
    </select>

    <label>What are you looking for?</label>
    <select id="cooperation">
      <option value="">No preference</option>
      <option>Full Stall Takeover</option>
      <option>Apprenticeship / Training (No Pay)</option>
      <option>Apprenticeship / Training (With Pay)</option>
      <option>Partnership</option>
    </select>

    <label>Preferred commitment level</label>
    <select id="commitment">
      <option value="">No preference</option>
      <option>Part-time</option>
      <option>Full-time</option>
      <option>Long-term</option>
    </select>

    <button onclick="findMatches()">Find my matches</button>
    <br>
    <a class="back-link" href="index.html">Back to main page</a>
  </div>

  <div id="results"></div>

</div>

<script>
const sheetURLs = [
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuhhfOdptB_dD6bCtEKxqSMaMMsQwKJrutpm_6_0700tBfd05o_pinEsDMoJo2_IefY8PAmXw_oZ6R/pub?gid=573141939&single=true&output=csv",
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuhhfOdptB_dD6bCtEKxqSMaMMsQwKJrutpm_6_0700tBfd05o_pinEsDMoJo2_IefY8PAmXw_oZ6R/pub?gid=1090865305&single=true&output=csv",
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuhhfOdptB_dD6bCtEKxqSMaMMsQwKJrutpm_6_0700tBfd05o_pinEsDMoJo2_IefY8PAmXw_oZ6R/pub?gid=346350130&single=true&output=csv",
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuhhfOdptB_dD6bCtEKxqSMaMMsQwKJrutpm_6_0700tBfd05o_pinEsDMoJo2_IefY8PAmXw_oZ6R/pub?gid=208707379&single=true&output=csv"
];

let hawkers = [];

function clean(text) {
  return (text || "").trim();
}

function normalizeValue(value) {
  value = clean(value);

  const map = {
    "北部": "North", "Utara": "North", "வடக்கு": "North",
    "南部": "South", "Selatan": "South", "தெற்கு": "South",
    "东部": "East", "Timur": "East", "கிழக்கு": "East",
    "西部": "West", "Barat": "West", "மேற்கு": "West",
    "中部": "Central", "Pusat": "Central", "மத்திய": "Central",

    "中国菜": "Chinese", "中式": "Chinese", "சீன": "Chinese",
    "马来菜": "Malay", "Melayu": "Malay", "மலாய்": "Malay",
    "印度菜": "Indian", "இந்திய": "Indian",
    "西餐": "Western", "மேலைநாட்டு": "Western",

    "中文": "Chinese", "华文": "Chinese",
    "Bahasa Melayu": "Malay",
    "தமிழ்": "Tamil",

    "兼职": "Part-time", "Separuh masa": "Part-time", "பகுதி நேரம்": "Part-time",
    "全职": "Full-time", "Sepenuh masa": "Full-time", "முழு நேரம்": "Full-time",
    "长期": "Long-term", "Jangka panjang": "Long-term", "நீண்டகாலம்": "Long-term",

    "摊位全面接管": "Full Stall Takeover",
    "学徒/培训（无薪）": "Apprenticeship / Training (No Pay)",
    "学徒/培训（有薪）": "Apprenticeship / Training (With Pay)",
    "合伙经营": "Partnership"
  };

  return map[value] || value;
}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let value = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {
      value += '"';
      i++;
    } else if (char === '"') {
      insideQuotes = !insideQuotes;
    } else if (char === "," && !insideQuotes) {
      row.push(value);
      value = "";
    } else if ((char === "\n" || char === "\r") && !insideQuotes) {
      if (value || row.length > 0) {
        row.push(value);
        rows.push(row);
        row = [];
        value = "";
      }
    } else {
      value += char;
    }
  }

  if (value || row.length > 0) {
    row.push(value);
    rows.push(row);
  }

  return rows;
}

function getValue(record, possibleHeaders) {
  for (const header of possibleHeaders) {
    if (record[header] !== undefined && clean(record[header]) !== "") {
      return clean(record[header]);
    }
  }
  return "";
}

function splitOptions(value) {
  return clean(value)
    .split(",")
    .map(v => normalizeValue(v.trim()))
    .filter(v => v !== "");
}

function combine(main, other) {
  main = clean(main);
  other = clean(other);
  if (main && other) return main + ", " + other;
  return main || other || "";
}

function getImageURL(link) {
  if (!link) return "https://via.placeholder.com/300x200?text=HawkerBridge";

  if (link.includes("drive.google.com")) {
    const match = link.match(/[-\w]{25,}/);
    if (match) {
      return `https://drive.google.com/thumbnail?id=${match[0]}&sz=w1000`;
    }
  }

  return link;
}

Promise.all(sheetURLs.map(url => fetch(url).then(res => res.text())))
  .then(results => {
    results.forEach(data => {
      const rows = parseCSV(data);
      const headers = rows[0].map(h => clean(h));

      rows.slice(1).forEach(row => {
        let record = {};
        headers.forEach((header, index) => {
          record[header] = clean(row[index]);
        });

        const cuisineMain = getValue(record, [
          "Cuisine Type", "菜品类型", "Jenis Masakan", "சமையல் வகை"
        ]);

        const cooperationMain = getValue(record, [
          "What are you looking for?",
          "您正在寻找什么类型的合作方式？",
          "Apakah yang anda tawarkan?",
          "நீங்கள் தேடுவது என்ன?"
        ]);

        const cooperationOther = getValue(record, [
          "Other (Cooperation Type)",
          "其他合作方式（如有）",
          "Jenis kerjasama lain (jika ada)",
          "மற்ற ஒத்துழைப்பு முறை (இருந்தால் குறிப்பிடவும்)"
        ]);

        const languageMain = getValue(record, [
          "What languages can you speak",
          "你会说哪些语言",
          "Apakah bahasa yang anda boleh bertutur",
          "நீங்கள் எந்த மொழிகளை பேச முடியும்:"
        ]);

        const languageOther = getValue(record, [
          "Other (Language)",
          "其他语言（如有）",
          "Bahasa lain (jika ada)",
          "மற்ற மொழிகள் (இருந்தால் குறிப்பிடவும்)"
        ]);

        const imageDisplay = getValue(record, [
          "Image (Display)", "Image Display", "Display Image", "Thumbnail Image"
        ]);

        const imageOriginal = getValue(record, [
          "Stall/Food image",
          "摊位/食品图片",
          "Gambar Gerai/Makanan",
          "கடை / உணவு படம்"
        ]);

        const hawker = {
          name: getValue(record, ["Full Name", "姓名", "Nama Penuh", "முழு பெயர்"]),
          stallName: getValue(record, ["Stall Name", "摊位名称", "Nama Gerai", "கடை பெயர்"]),
          location: getValue(record, ["Location of Stall", "摊位位置", "Lokasi Gerai", "கடை அமைந்துள்ள இடம்"]),
          phone: getValue(record, ["Contact Number", "联系电话", "Nombor Perhubungan", "தொடர்பு எண்"]),
          email: getValue(record, ["Email (Optional)", "电子邮件（可选）", "E-mel (Pilihan)", "மின்னஞ்சல் (விருப்பம்)"]),
          cuisine: splitOptions(cuisineMain).join(", "),
          foodType: getValue(record, [
            "Type of Food (e.g Chicken Rice, Wanton Mee)",
            "食物类型（例如：鸡饭、云吞面）",
            "Jenis Makanan (contoh: Nasi Ayam, Wanton Mee)",
            "உணவு வகை (எ.கா.: சிக்கன் ரைஸ், வொண்டன் மீ)"
          ]),
          image: imageDisplay || imageOriginal,
          cooperation: splitOptions(combine(cooperationMain, cooperationOther)).join(", "),
          commitment: normalizeValue(getValue(record, [
            "Preferred Commitment Level",
            "首选承诺水平",
            "Tahap komitmen yang diingini",
            "விரும்பப்படும் ஒப்பந்த நிலை"
          ])),
          languages: splitOptions(combine(languageMain, languageOther)).join(", "),
          vicinity: normalizeValue(getValue(record, [
            "General vicinity of your stall",
            "您的摊位大致位于哪个区域？",
            "Kawasan umum gerai anda",
            "உங்கள் கடை அமைந்துள்ள பொது பகுதி"
          ])),
          directContact: getValue(record, [
            "Are you willing to be contacted directly by interested applicants?",
            "您是否愿意接受有意向的申请人的直接联系？",
            "Adakah anda bersetuju untuk dihubungi secara langsung oleh pemohon yang berminat?",
            "ஆர்வமுள்ள விண்ணப்பதாரர்கள் நேரடியாக உங்களை தொடர்பு கொள்ள அனுமதிக்கிறீர்களா?"
          ])
        };

        if (hawker.name && hawker.stallName) {
          hawkers.push(hawker);
        }
      });
    });

    document.getElementById("results").innerHTML = "";
  });

function findMatches() {
  const selectedVicinity = document.getElementById("vicinity").value;
  const selectedCuisine = document.getElementById("cuisine").value;
  const selectedLanguage = document.getElementById("language").value;
  const selectedCooperation = document.getElementById("cooperation").value;
  const selectedCommitment = document.getElementById("commitment").value;

  const scored = hawkers.map(h => {
    let score = 0;

    if (selectedVicinity && h.vicinity === selectedVicinity) score += 3;
    if (selectedCuisine && h.cuisine.includes(selectedCuisine)) score += 3;
    if (selectedLanguage && h.languages.includes(selectedLanguage)) score += 2;
    if (selectedCooperation && h.cooperation.includes(selectedCooperation)) score += 3;
    if (selectedCommitment && h.commitment === selectedCommitment) score += 2;

    return { ...h, score };
  });

  const matches = scored
    .filter(h => h.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);

  displayMatches(matches);
}

function displayMatches(matches) {
  let html = "<h2>Your recommended matches</h2>";

  if (matches.length === 0) {
    document.getElementById("results").innerHTML = `
      <div class="result-card">
        <h3>No strong matches found</h3>
        <p>Try selecting fewer preferences or go back to the main page to browse all hawkers.</p>
        <a class="back-link" href="index.html">Browse all hawkers</a>
      </div>
    `;
    return;
  }

  matches.forEach(h => {
    const direct = (h.directContact || "").toLowerCase();

    const allowedDirectContact =
      direct.includes("yes") ||
      direct.includes("要") ||
      direct.includes("ya") ||
      direct.includes("ஆம்");

    const contactInfo = allowedDirectContact
      ? `<p><strong>Contact:</strong> ${h.phone}</p>`
      : `<p class="hidden-contact">This hawker prefers to be contacted through HawkerBridge matching.</p>`;

    html += `
      <div class="result-card">
        <img src="${getImageURL(h.image)}" alt="${h.stallName}">
        <span class="score">Match score: ${h.score}</span>
        <h3>${h.stallName}</h3>
        <p><strong>Hawker:</strong> ${h.name}</p>
        <p><strong>Cuisine:</strong> ${h.cuisine}</p>
        <p><strong>Food:</strong> ${h.foodType}</p>
        <p><strong>Location:</strong> ${h.location} (${h.vicinity})</p>
        <p><strong>Languages:</strong> ${h.languages}</p>
        <p><strong>Opportunity:</strong> ${h.cooperation}</p>
        <p><strong>Commitment:</strong> ${h.commitment}</p>
        ${contactInfo}
      </div>
    `;
  });

  document.getElementById("results").innerHTML = html;
}
</script>

</body>
</html>
